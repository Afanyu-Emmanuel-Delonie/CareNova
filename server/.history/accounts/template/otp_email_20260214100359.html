<!DOCTYPE html>
<html>
<head>
    <style>
        .container { font-family: Arial, sans-serif; padding: 20px; border: 1px solid #e0e0e0; border-radius: 10px; max-width: 500px; }
        .header { color: #2e7d32; font-size: 24px; font-weight: bold; margin-bottom: 20px; text-align: center; }
        .content { color: #333; line-height: 1.6; }
        .otp-box { background-color: #e8f5e9; color: #2e7d32; font-size: 32px; font-weight: bold; text-align: center; 
                   padding: 20px; margin: 20px 0; border-radius: 5px; letter-spacing: 5px; }
        .footer { font-size: 12px; color: #888; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">CareNova</div>
        <div class="content">
            <p>Hello,</p>
            <p>Thank you for choosing CareNova. Use the following code to verify your email address. This code is valid for a limited time.</p>
            <div class="otp-box">{{ otp_code }}</div>
            <p>If you did not request this code, please ignore this email.</p>
        </div>
        <div class="footer">
            &copy; 2026 CareNova. All rights reserved.
        </div>
    </div>
</body>
</html>
