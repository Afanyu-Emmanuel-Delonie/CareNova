<html>
<body style="font-family: Arial, sans-serif; color: #333;">
    <h2 style="color: #2c3e50;">Hello {{ patient_name }},</h2>
    <p>Your appointment with <strong>{{ doctor_name }}</strong> has been confirmed.</p>
    <div style="background: #f9f9f9; padding: 15px; border-left: 4px solid #3498db;">
        <p><strong>Date:</strong> {{ date }}</p>
        <p><strong>Time:</strong> {{ time }}</p>
    </div>
    <p>Please arrive 10 minutes early. You can manage this appointment in the CareNova app.</p>
    <p>Stay healthy,<br>The CareNova Team</p>
</body>
</html>
