services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=carenova
      - POSTGRES_USER=afany
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://postgres:UBa22S0391:5432/carenova
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: celery -A core worker --loglevel=info -P eventlet
    volumes:
      - .:/app
    depends_on:
      - redis
      - db

volumes:
  postgres_data: